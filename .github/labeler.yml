# Labels added from the changed paths (actions/labeler, run by the community workflow).
documentation:
  - changed-files:
      - any-glob-to-any-file: ['**/*.md', 'docs/**', 'content/**']
ci:
  - changed-files:
      - any-glob-to-any-file: ['.github/**']
dependencies:
  - changed-files:
      - any-glob-to-any-file: ['package.json', 'pnpm-lock.yaml']
